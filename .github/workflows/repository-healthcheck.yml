name: Repository Health Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level to check"
        required: true
        default: "ALL"
        type: choice
        options:
          - ERROR
          - WARN
          - INFO
          - ALL

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make health-check script executable
        run: chmod u+x repository-healthcheck.sh log-report.sh

      - name: Run repository health-check
        run: ./repository-healthcheck.sh

      - name: Display selected log level
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
        run: |
          echo "Selected log level: $LOG_LEVEL"

      - name: Run log report
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
        run: |
          ./log-report.sh app.log "$LOG_LEVEL"
