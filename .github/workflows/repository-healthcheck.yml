name: Repository Health Check

on:
  push:
   branches:
     - main
  pull_request:
     branches:
     - main
  workflow_dispatch:
    inputs:
      log_level:
       description: "Log Level to check"
       required: true
       default: "ALL"
       type: choice
       options:
          - ERROR
          - WARN
          - INFO
          - ALL


permissions:
   contents: read

jobs:
  health-check:
   runs-on: ubuntu-latest

   steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
         persist-credentials: false

    - name: Make health-check script executable
      run:  chmod u+x repository-healthcheck.sh

    - name: Run repository health-check
      run:  ./repository-healthcheck.sh

    - name: Display selected log level
      run: echo "Selected log level: ${{ inputs.log_level }}"

    - name: Run log report
      run : ./log-report.sh app.log "${{ inputs.log_level }}"
