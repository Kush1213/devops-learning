name: Repository Health Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level to check"
        required: true
        default: "ALL"
        type: choice
        options:
          - ERROR
          - WARN
          - INFO
          - ALL

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make health-check script executable
        run: chmod u+x repository-healthcheck.sh log-report.sh

      - name: Run repository health-check
        run: ./repository-healthcheck.sh

      - name: Display selected log level
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'ALL' }}
        run: |
          echo "Selected log level: $LOG_LEVEL"

      - name: Run log report
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'ALL' }}
        run: |
          ./log-report.sh app.log "$LOG_LEVEL" | tee health-report.txt

      - name: Save health-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-health-report
          path: |
             app.log
             health-report.txt
          if-no-files-found: warn

#      - name: Test repository secret
  #       env:
   #       DEMO_MESSAGE: ${{ secrets.DEMO_MESSAGE }}
    #    run: |
     #    if [ -n "$DEMO_MESSAGE" ]; then
      #     echo "Secret was loaded successfully"
       #  else
        #   echo "Secret is missing"
        #  exit 1
       #   fi

  log-level-check:
      name: Check ${{ matrix.level }} logs
      runs-on: ubuntu-latest

      strategy:
        matrix:
         level:
          - ERROR
          - WARN
          - INFO
          - ALL

      steps:
       - name: Checkout Repository
         uses: actions/checkout@v4
         with:
           persist-credentials: false

       - name: Make log report executable
         run: chmod u+x log-report.sh

       - name: Run log report
         run: ./log-report.sh app.log "${{ matrix.level }}"

  shellcheck:
    name: Shellcheck Bash Scripts
    runs-on: ubuntu-latest

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Cache shellcheck
        id: cache-shellcheck
       uses: actions/cache@v4
       with:
         path: /usr/bin/shellcheck
         key: shellcheck-${{ runner.os }}

     - name: Install shellcheck
       if: steps.cache-shellcheck.outputs.cache-hit != 'true'
       run: sudo apt-get update && sudo apt-get install -y shellcheck

     - name: Run shellcheck
       run: shellcheck repository-healthcheck.sh log-report.sh



  reusable-log-check:
     name: Reusable check for ${{ matrix.level }}
     strategy:
      matrix:
        level:
          - ERROR
          - WARN
          - INFO
          - ALL

     uses: ./.github/workflows/reusable-log-check.yml
     with:
       log_level: ${{ matrix.level }}

  cross-platform-check:
     name: Check on ${{ matrix.os }}
     runs-on: ${{ matrix.os }}

     strategy:
       matrix:
         os:
          - ubuntu-latest
          - windows-latest

     steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Checkout repository files
          shell: bash
          run: |
           test -f app.log
           test -f log-report.sh
           echo "Required files are present."


  deploy-production:
    needs: health-check
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Simulate production deployment
        run: |
          echo "Production deployment approved."
          echo "Deploying commit: $GITHUB_SHA"
